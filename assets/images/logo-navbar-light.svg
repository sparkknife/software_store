<svg width="340" height="64" viewBox="0 0 340 64" xmlns="http://www.w3.org/2000/svg">
  <style>.ft{font-family:Tahoma, 'B Nazanin', Arial, sans-serif;}</style>
  <defs>
    <linearGradient id="g1-lgt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="g2-lgt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="radial-lgt" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.03"/>
    </radialGradient>
    <filter id="glow1-lgt" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2-lgt" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- icon for light -->
  <g transform="translate(307,32)">
    <circle cx="0" cy="0" r="31" fill="url(#radial-lgt)" filter="url(#glow2-lgt)"/>
    <polygon points="0.0,-26.0 22.5,-13.0 22.5,13.0 0.0,26.0 -22.5,13.0 -22.5,-13.0"
      fill="url(#radial-lgt)" opacity="0.45"/>
    <polygon points="0.0,-26.0 22.5,-13.0 22.5,13.0 0.0,26.0 -22.5,13.0 -22.5,-13.0"
