  <line x1="90" y1="38" x2="260" y2="38"
    stroke="#0d9488" stroke-width="0.7" opacity="0.3"/>
  <text class="ft" x="260" y="52"
    text-anchor="end" font-size="10.5" font-weight="600"
    fill="#0d9488" opacity="0.85">نرم‌افزارهای لابراتوار دیجیتال دندانپزشکی</text>
