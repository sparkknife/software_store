    <g transform="scale(0.9286)">
      <path d="M -10,-14 C -7,-21 -3,-21 0,-17 C 3,-21 7,-21 10,-14
               C 14,-7 13,5 8,11 C 5,15 3,12 0,7 C -3,12 -5,15 -8,11
               C -13,5 -14,-7 -10,-14 Z"
        fill="url(#g1-lgt)" fill-opacity="0.22"
        stroke="url(#g1-lgt)" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M 0,-17 L 0,7 M -10,-3 H 10"
        fill="none" stroke="#1e293b" stroke-width="0.9" stroke-opacity="0.4"/>
      <path d="M -15,0 C -11,9 11,9 15,0"
        fill="none" stroke="#0d9488" stroke-width="1.6"
        stroke-linecap="round" stroke-dasharray="3,2.5"/>
      <path d="M 0,-9 L 1.8,-4 L 7,-3 L 1.8,-2 L 0,3 L -1.8,-2 L -7,-3 L -1.8,-4 Z"
        fill="url(#g2-lgt)" filter="url(#glow1-lgt)"/>
      <circle cx="-10" cy="-14" r="2.2" fill="#0d9488" filter="url(#glow1-lgt)"/>
      <circle cx=" 10" cy="-14" r="2.2" fill="#0d9488" filter="url(#glow1-lgt)"/>
      <circle cx="  0" cy="-19" r="2.6" fill="#0d9488" filter="url(#glow1-lgt)"/>
    </g>
  </g>
  <line x1="272" y1="12" x2="272" y2="52"
