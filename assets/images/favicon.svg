<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1-fav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="g2-fav" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="radial-fav" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00d4ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.04"/>
    </radialGradient>
    <filter id="glow1-fav" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2-fav" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- ═══ ICON-fav ═══ -->
  <g transform="translate(32.0,32.0)">
    <!-- هاله -->
    <circle cx="0" cy="0" r="31"
      fill="url(#radial-fav)" filter="url(#glow2-fav)"/>

    <!-- شش‌ضلعی -->
    <polygon points="0.0,-27.0 23.4,-13.5 23.4,13.5 0.0,27.0 -23.4,13.5 -23.4,-13.5"
      fill="url(#radial-fav)" opacity="0.45"/>
    <polygon points="0.0,-27.0 23.4,-13.5 23.4,13.5 0.0,27.0 -23.4,13.5 -23.4,-13.5"
      fill="none" stroke="url(#g1-fav)" stroke-width="1.8" opacity="0.8"/>

    <!-- دندان - مختصات relative به مرکز (scale داخلی ۲۸) -->
    <g transform="scale(0.9643)">
      <!-- بدنه دندان -->
      <path d="M -10,-14 C -7,-21 -3,-21 0,-17
               C 3,-21 7,-21 10,-14
               C 14,-7 13,5 8,11
               C 5,15 3,12 0,7
               C -3,12 -5,15 -8,11
               C -13,5 -14,-7 -10,-14 Z"
        fill="url(#g1-fav)" fill-opacity="0.22"
        stroke="url(#g1-fav)" stroke-width="2.2"
        stroke-linejoin="round"/>

      <!-- خطوط مش -->
      <path d="M 0,-17 L 0,7 M -10,-3 H 10 M -8,-10 L 8,2"
        fill="none" stroke="#7c3aed" stroke-width="0.9" stroke-opacity="0.55"/>

      <!-- حلقه اسکنر -->
      <path d="M -15,0 C -11,9 11,9 15,0"
        fill="none" stroke="#06b6d4" stroke-width="1.6"
        stroke-linecap="round" stroke-dasharray="3,2.5"/>

      <!-- ستاره مرکز -->
      <path d="M 0,-9 L 1.8,-4 L 7,-3 L 1.8,-2 L 0,3 L -1.8,-2 L -7,-3 L -1.8,-4 Z"
        fill="url(#g2-fav)" filter="url(#glow1-fav)"/>

      <!-- نقاط -->
      <circle cx="-10" cy="-14" r="2.2" fill="#00d4ff" filter="url(#glow1-fav)"/>
      <circle cx=" 10" cy="-14" r="2.2" fill="#00d4ff" filter="url(#glow1-fav)"/>
      <circle cx="  0" cy="-19" r="2.6" fill="#06b6d4" filter="url(#glow1-fav)"/>
      <circle cx="  0" cy="  7" r="2"   fill="#7c3aed" filter="url(#glow1-fav)"/>
    </g>
  </g>
</svg>